name: hub-ab-isolation

services:
  postgres:
    image: postgres:16
    container_name: hub-ab-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: hub-ab-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  map-stub:
    image: node:22-alpine
    container_name: hub-ab-map-stub
    working_dir: /app
    ports:
      - "18089:18080"
    volumes:
      - ./map-stub.mjs:/app/map-stub.mjs:ro
    environment:
      MAP_STUB_LATENCY_MS: "${HUB_AB_MAP_LATENCY_MS:-2000}"
    command: ["node", "/app/map-stub.mjs"]

  hub-api:
    image: eclipse-temurin:21-jre-jammy
    container_name: hub-ab-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      map-stub:
        condition: service_started
    cpus: 1.0
    mem_limit: 1g
    ports:
      - "18088:8080"
    volumes:
      - ../../build/libs/hub_prodcut_stock_company-0.0.1-SNAPSHOT.jar:/app.jar:ro
      - ./results:/results
    environment:
      SPRING_PROFILES_ACTIVE: test,hub-api
      SPRING_TASK_SCHEDULING_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "${HUB_AB_API_HIKARI_POOL_SIZE:-20}"
      SPRING_DATA_REDIS_CACHE_HOST: redis
      CACHE_CONFIG_HUB_SERVICE: REDIS
      KAKAO_MOBILITY_BASE_URL: http://map-stub:18080
      HUB_API_EVENTS_ENABLED: "false"
      HUB_OUTBOX_SCHEDULER_ENABLED: "false"
      HUB_ROUTE_EVENTS_ENABLED: "false"
      HUB_ROUTE_PLANNING_SCHEDULER_ENABLED: "false"
      HUB_ROUTE_BUILD_SCHEDULER_ENABLED: "false"
      HUB_ROUTE_REFRESH_ENABLED: "false"
      HUB_ROUTE_WORKER_ENABLED: "false"
      STOCK_EVENTS_ENABLED: "false"
      STOCK_INBOX_SCHEDULER_ENABLED: "false"
      BENCHMARK_SYNC_ROUTE_BUILD_ENABLED: "${HUB_AB_SYNC_ROUTE_BUILD_ENABLED:-false}"
    command:
      - java
      - "${HUB_AB_XMS:--Xms256m}"
      - "${HUB_AB_XMX:--Xmx256m}"
      - -XX:ActiveProcessorCount=1
      - "${HUB_AB_GC_OPTION:--XX:+UseG1GC}"
      - -Xlog:gc*:file=/results/ab-api-gc.log:time,uptime,level,tags
      - -XX:StartFlightRecording=filename=/results/ab-api.jfr,settings=default,dumponexit=true
      - -jar
      - /app.jar

  route-worker:
    image: eclipse-temurin:21-jre-jammy
    container_name: hub-ab-route-worker
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      map-stub:
        condition: service_started
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - ../../build/libs/hub_prodcut_stock_company-0.0.1-SNAPSHOT.jar:/app.jar:ro
      - ./results:/results
    environment:
      SPRING_PROFILES_ACTIVE: test,route-worker
      SPRING_TASK_SCHEDULING_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "${HUB_AB_WORKER_HIKARI_POOL_SIZE:-4}"
      SPRING_DATA_REDIS_CACHE_HOST: redis
      CACHE_CONFIG_HUB_SERVICE: REDIS
      KAKAO_MOBILITY_BASE_URL: http://map-stub:18080
      HUB_API_EVENTS_ENABLED: "false"
      HUB_OUTBOX_SCHEDULER_ENABLED: "false"
      HUB_ROUTE_EVENTS_ENABLED: "false"
      HUB_ROUTE_PLANNING_SCHEDULER_ENABLED: "true"
      HUB_ROUTE_BUILD_SCHEDULER_ENABLED: "true"
      HUB_ROUTE_BUILD_BATCH_SIZE: "${HUB_AB_ROUTE_BUILD_BATCH_SIZE:-2}"
      HUB_ROUTE_BUILD_FIXED_DELAY_MS: "${HUB_AB_ROUTE_BUILD_FIXED_DELAY_MS:-500}"
      HUB_ROUTE_REFRESH_ENABLED: "false"
      HUB_ROUTE_WORKER_ENABLED: "false"
      STOCK_EVENTS_ENABLED: "false"
      STOCK_INBOX_SCHEDULER_ENABLED: "false"
      BENCHMARK_SYNC_ROUTE_BUILD_ENABLED: "false"
    command:
      - java
      - "${HUB_AB_XMS:--Xms256m}"
      - "${HUB_AB_XMX:--Xmx256m}"
      - -XX:ActiveProcessorCount=1
      - "${HUB_AB_GC_OPTION:--XX:+UseG1GC}"
      - -Xlog:gc*:file=/results/ab-worker-gc.log:time,uptime,level,tags
      - -XX:StartFlightRecording=filename=/results/ab-worker.jfr,settings=default,dumponexit=true
      - -jar
      - /app.jar
