spring:
  config:
    activate:
      on-profile: test

  application:
    name: hub-product-stock-company-test

  main:
    banner-mode: off
    log-startup-info: false

  cloud:
    openfeign:
      client:
        config:
          kakao-mobility-client:
            connectTimeout: 1000
            readTimeout: 4000
          naver-map-client:
            connectTimeout: 1000
            readTimeout: 4000

  task:
    scheduling:
      enabled: false

  data:
    redis:
      cache:
        host: localhost
        port: 6379
        password:
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화
      black-friday:
        host: localhost
        port: 63799
        password:
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화

  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      jakarta.persistence.lock.timeout: 1000
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    topics:
      hub: hub-test
      order: order-test
    producer:
      retries: 0
      acks: 0
    consumer:
      hub: hub
      hub-route: hub-route
      product: product
      stock: stock
      company: company

# Eureka 완전 비활성화
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# 인증 설정
eas:
  passport:
    secretKey: test-secret-key-must-be-at-least-32-characters-long-for-hs256-algorithm
    expiration: 604800
    algorithm: HS256

# 캐시 설정
cache:
  config:
    hubService: true  # 테스트에서도 캐시 빈 생성  # 테스트에서는 캐시 비활성화 권장
dynamic:
  enabled: true           # true: 런타임 전환 모드
  hubCache: REDIS         # REDIS | NONE
  stockLock: DEFAULT      # DEFAULT | PESSIMISTIC_LOCK
# 외부 API 설정
kakao:
  mobility:
    base-url: http://localhost:18080
    api-key: dummy-kakao-api-key-for-test

naver:
  maps:
    base-url: https://maps.apigw.ntruss.com
    api-key-id: dummy-naver-api-key-id-for-test
    api-key: dummy-naver-api-key-for-test

hub:
  outbox:
    scheduler:
      enabled: true
  cache:
    ttl: 30m
    lock-ttl: 3s
    wait-interval: 50ms
    max-wait-attempts: 10
    db-fallback-bulkhead-size: 20
  compensation:
    deleted-by: 0
  route:
    events:
      enabled: true
    planning:
      scheduler:
        enabled: false
      fixed-delay-ms: 500
      stale-timeout: 5m
    worker:
      enabled: true
      concurrency: 2
    provider-unavailable-ttl: 30s
    rate-limit:
      kakao:
        permits-per-second: 100000
      naver:
        permits-per-second: 100000
      retry-delay: 1s
      retry-jitter-max: 0ms
    refresh:
      enabled: false
      interval: 5m
      poll-delay-ms: 1000
      batch-size: 10
      stale-timeout: 5m
      non-retryable-delay: 30m
      fallback-reconcile-delay: 1m
    build:
      scheduler:
        enabled: false
      fixed-delay-ms: 1000
      batch-size: 2
      stale-processing-timeout: 5m
      primary-retry-delay: 5s
      retry-backoff: 10s
      retry-backoff-max: 2m
      retry-jitter-max: 0ms
      max-retries: 3

# Resilience4j 비활성화
resilience4j:
  circuitbreaker:
    instances:
      kakaoRoute:
        baseConfig: default
      naverRoute:
        baseConfig: default
    configs:
      default:
        registerHealthIndicator: false
        slidingWindowType: TIME_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 100  # 항상 닫힌 상태 유지
        recordExceptions:
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteProviderTransientException
        ignoreExceptions:
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteRateLimitExceededException
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteRequestRejectedException
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteProviderConfigurationException
  ratelimiter:
    instances:
      kakaoRoute:
        limitForPeriod: 100000
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms
      naverRoute:
        limitForPeriod: 100000
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms

# 모니터링 완전 비활성화
management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    enabled: false
    export:
      prometheus:
        enabled: false
  tracing:
    enabled: false
    sampling:
      probability: 0.0
  health:
    circuitbreakers:
      enabled: false
    diskspace:
      enabled: false
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces  # 비활성화되었지만 값은 필요

# Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
