spring:
  config:
    activate:
      on-profile: route-worker
  application:
    name: hub-route-worker
  main:
    web-application-type: none

hub:
  api:
    events:
      enabled: false
  outbox:
    scheduler:
      enabled: false
  route:
    events:
      enabled: false
    planning:
      scheduler:
        enabled: true
      fixed-delay-ms: 500
      stale-timeout: 5m
    worker:
      enabled: false
    refresh:
      enabled: false
    build:
      scheduler:
        enabled: true
      batch-size: 2
      fixed-delay-ms: 500

stock:
  events:
    enabled: false
  inbox:
    scheduler:
      enabled: false
