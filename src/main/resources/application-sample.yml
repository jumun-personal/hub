server:
  port: 8088

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: hub-product-stock-company
  profiles:
    active: dev

  cloud:
    openfeign:
      client:
        config:
          kakao-mobility-client:
            connectTimeout: ${KAKAO_ROUTE_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${KAKAO_ROUTE_READ_TIMEOUT_MS:4000}
          naver-map-client:
            connectTimeout: ${NAVER_ROUTE_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${NAVER_ROUTE_READ_TIMEOUT_MS:4000}

  data:
    redis:
      cache:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD:}
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화
      black-friday:
        host: ${BF_REDIS_HOST}
        port: ${BF_REDIS_PORT}
        password: ${BF_REDIS_PASSWORD:}
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?reWriteBatchedInserts=true
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      jakarta.persistence.lock.timeout: ${DB_LOCK_TIME_OUT}
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
  kafka:
    # 브로커 주소
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS} # localhost:9092
    # 토픽 설정 (커스텀)
    topics:
      hub: hub
      order: order
    producer:
      retries: 3
    consumer:
      # 컨슈머 그룹
      hub: ${KAFKA_CONSUMER_GROUP_HUB_DOMAIN}
      hub-route: ${KAFKA_CONSUMER_GROUP_HUB-ROUTE_DOMAIN}
      product: ${KAFKA_CONSUMER_GROUP_PRODUCT_DOMAIN}
      stock: ${KAFKA_CONSUMER_GROUP_STOCK_DOMAIN}
      company: ${KAFKA_CONSUMER_GROUP_COMPANY_DOMAIN}

# 로깅 설정 (Loki로 전송하기 위해 logback-spring.xml 사용 권장하지만, 간단 설정은 아래 참조)
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"
  level:
    # Hibernate binding 로그
    org.hibernate.orm.jdbc.bind: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
    # Hibernate SQL
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG


cache:
  config:
    hubService: ${HUB_SERVICE_CACHEABLE:REDIS}

stock:
  lock-type: ${STOCK_LOCK_TYPE:DEFAULT}
  events:
    enabled: ${STOCK_EVENTS_ENABLED:true}
  inbox:
    scheduler:
      enabled: ${STOCK_INBOX_SCHEDULER_ENABLED:true}

kakao:
  mobility:
    base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
    api-key: ${KAKAO_MOBILITY_API_KEY}

naver:
  maps:
    base-url: ${NAVER_MAPS_BASE_URL:https://maps.apigw.ntruss.com}
    api-key-id: ${NAVER_MAPS_API_KEY_ID}
    api-key: ${NAVER_MAPS_API_KEY}

hub:
  api:
    events:
      enabled: ${HUB_API_EVENTS_ENABLED:true}
  outbox:
    scheduler:
      enabled: ${HUB_OUTBOX_SCHEDULER_ENABLED:true}
  cache:
    ttl: ${HUB_CACHE_TTL:30m}
    lock-ttl: ${HUB_CACHE_LOCK_TTL:3s}
    wait-interval: ${HUB_CACHE_WAIT_INTERVAL:50ms}
    max-wait-attempts: ${HUB_CACHE_MAX_WAIT_ATTEMPTS:10}
    db-fallback-bulkhead-size: ${HUB_CACHE_DB_FALLBACK_BULKHEAD_SIZE:20}
  compensation:
    deleted-by: ${HUB_COMPENSATION_DELETED_BY:0}
  route:
    events:
      enabled: ${HUB_ROUTE_EVENTS_ENABLED:true}
    planning:
      scheduler:
        enabled: ${HUB_ROUTE_PLANNING_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${HUB_ROUTE_PLANNING_FIXED_DELAY_MS:500}
      stale-timeout: ${HUB_ROUTE_PLANNING_STALE_TIMEOUT:5m}
    worker:
      enabled: ${HUB_ROUTE_WORKER_ENABLED:false}
      concurrency: ${HUB_ROUTE_WORKER_CONCURRENCY:2}
    provider-unavailable-ttl: ${HUB_ROUTE_PROVIDER_UNAVAILABLE_TTL:30s}
    rate-limit:
      kakao:
        permits-per-second: ${HUB_ROUTE_KAKAO_PERMITS_PER_SECOND:20}
      naver:
        permits-per-second: ${HUB_ROUTE_NAVER_PERMITS_PER_SECOND:20}
      retry-delay: ${HUB_ROUTE_RATE_LIMIT_RETRY_DELAY:1s}
      retry-jitter-max: ${HUB_ROUTE_RATE_LIMIT_RETRY_JITTER_MAX:500ms}
    refresh:
      enabled: ${HUB_ROUTE_REFRESH_ENABLED:true}
      interval: ${HUB_ROUTE_REFRESH_INTERVAL:5m}
      poll-delay-ms: ${HUB_ROUTE_REFRESH_POLL_DELAY_MS:1000}
      batch-size: ${HUB_ROUTE_REFRESH_BATCH_SIZE:10}
      stale-timeout: ${HUB_ROUTE_REFRESH_STALE_TIMEOUT:5m}
      non-retryable-delay: ${HUB_ROUTE_REFRESH_NON_RETRYABLE_DELAY:30m}
      fallback-reconcile-delay: ${HUB_ROUTE_FALLBACK_RECONCILE_DELAY:1m}
    build:
      scheduler:
        enabled: ${HUB_ROUTE_BUILD_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${HUB_ROUTE_BUILD_FIXED_DELAY_MS:500}
      batch-size: ${HUB_ROUTE_BUILD_BATCH_SIZE:2}
      stale-processing-timeout: ${HUB_ROUTE_BUILD_STALE_PROCESSING_TIMEOUT:5m}
      event-recovery-delay: ${HUB_ROUTE_BUILD_EVENT_RECOVERY_DELAY:5m}
      primary-retry-delay: ${HUB_ROUTE_PRIMARY_RETRY_DELAY:5s}
      retry-backoff: ${HUB_ROUTE_BUILD_RETRY_BACKOFF:10s}
      retry-backoff-max: ${HUB_ROUTE_BUILD_RETRY_BACKOFF_MAX:2m}
      retry-jitter-max: ${HUB_ROUTE_BUILD_RETRY_JITTER_MAX:2s}
      max-retries: ${HUB_ROUTE_BUILD_MAX_RETRIES:3}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_HOST}/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    ip-address: ${ECS_INSTANCE_IP_ADDRESS}


resilience4j:
  circuitbreaker:
    instances:
      kakaoRoute:
        registerHealthIndicator: true
        slidingWindowType: TIME_BASED
        slidingWindowSize: 30
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteProviderTransientException
        ignoreExceptions:
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteRateLimitExceededException
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteRequestRejectedException
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteProviderConfigurationException
      naverRoute:
        registerHealthIndicator: true
        slidingWindowType: TIME_BASED
        slidingWindowSize: 30
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteProviderTransientException
        ignoreExceptions:
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteRateLimitExceededException
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteRequestRejectedException
          - com.jumunhasyeo.hub.hubRoute.application.service.RouteProviderConfigurationException
  ratelimiter:
    instances:
      kakaoRoute:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms
      naverRoute:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms

eas:
  passport:
    secretKey: ${PASSPORT_SECRET}
    expiration: ${PASSPORT_EXPIRATION}
    algorithm: ${PASSPORT_ALGO}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus # Prometheus가 긁어갈 수 있게 노출
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true # P95, P99 등 히스토그램 데이터 수집
  otlp:
    tracing:
      endpoint: http://${MONITORING_URL}:4318/v1/traces # 로컬 Docker의 Tempo로 전송
  tracing:
    sampling:
      probability: 1.0 # 개발환경이므로 모든(100%) 트래픽 추적
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
