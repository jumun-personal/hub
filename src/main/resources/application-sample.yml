server:
  port: 8088

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: hub-product-stock-company
  profiles:
    active: dev

  data:
    redis:
      cache:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD:}
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화
      black-friday:
        host: ${BF_REDIS_HOST}
        port: ${BF_REDIS_PORT}
        password: ${BF_REDIS_PASSWORD:}
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      jakarta.persistence.lock.timeout: ${DB_LOCK_TIME_OUT}
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
  kafka:
    # 브로커 주소
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS} # localhost:9092
    # 토픽 설정 (커스텀)
    topics:
      hub: hub
      order: order
    producer:
      retries: 3
    consumer:
      # 컨슈머 그룹
      hub: ${KAFKA_CONSUMER_GROUP_HUB_DOMAIN}
      hub-route: ${KAFKA_CONSUMER_GROUP_HUB-ROUTE_DOMAIN}
      product: ${KAFKA_CONSUMER_GROUP_PRODUCT_DOMAIN}
      stock: ${KAFKA_CONSUMER_GROUP_STOCK_DOMAIN}
      company: ${KAFKA_CONSUMER_GROUP_COMPANY_DOMAIN}

# 로깅 설정 (Loki로 전송하기 위해 logback-spring.xml 사용 권장하지만, 간단 설정은 아래 참조)
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"
  level:
    # Hibernate binding 로그
    org.hibernate.orm.jdbc.bind: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
    # Hibernate SQL
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG


cache:
  config:
    hubService: ${HUB_SERVICE_CACHEABLE:REDIS}

kakao:
  mobility:
    api-key: ${KAKAO_MOBILITY_API_KEY}

naver:
  maps:
    base-url: ${NAVER_MAPS_BASE_URL:https://naveropenapi.apigw.ntruss.com}
    api-key-id: ${NAVER_MAPS_API_KEY_ID}
    api-key: ${NAVER_MAPS_API_KEY}

hub:
  compensation:
    deleted-by: ${HUB_COMPENSATION_DELETED_BY:0}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_HOST}/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    ip-address: ${ECS_INSTANCE_IP_ADDRESS}


resilience4j:
  circuitbreaker:
    instances:
      redisIdempotency:
        registerHealthIndicator: true  # Actuator health endpoint에 Circuit Breaker 상태 노출 (/actuator/health)
        slidingWindowSize: 10  # 실패율 계산을 위해 추적할 최근 호출 개수 (최근 10개) 낮은 트래픽 가정
        minimumNumberOfCalls: 5  # 실패율 계산 전 필요한 최소 호출 수 (5번 미만이면 무조건 CLOSED)
        failureRateThreshold: 50  # Circuit OPEN 전환 실패율 임계값 (50% 이상 실패 시 OPEN)
        waitDurationInOpenState: 10s  # OPEN 상태 유지 시간 (30초 후 HALF_OPEN으로 전환)
        permittedNumberOfCallsInHalfOpenState: 5  # HALF_OPEN 상태에서 허용할 테스트 호출 수
        automaticTransitionFromOpenToHalfOpenEnabled: true  # OPEN → HALF_OPEN 자동 전환 활성화 minimumNumberOfCalls과동일
        recordExceptions:  # 실패로 기록할 예외 목록 (이 예외들만 실패율 계산에 포함)
          - org.springframework.data.redis.RedisConnectionFailureException  # Redis 연결 실패
          - java.net.ConnectException  # 네트워크 연결 실패
          - java.io.IOException  # I/O 예외
      redisCache:
        registerHealthIndicator: true
        slidingWindowSize: 10          # 최근 10개 호출 추적
        minimumNumberOfCalls: 5        # 최소 5번 호출 후 실패율 계산
        failureRateThreshold: 50       # 50% 실패 시 Circuit OPEN
        waitDurationInOpenState: 10s   # OPEN 상태 10초 유지
        permittedNumberOfCallsInHalfOpenState: 3  # HALF_OPEN에서 3번 테스트
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
          - org.springframework.data.redis.RedisSystemException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - java.io.IOException
      kakaoRoute:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      naverRoute:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      redisIdempotency:
        maxAttempts: 3  # 최대 3번 시도 (첫 시도 + 재시도 2번)
        waitDuration: 500ms  # 재시도 간격 500ms
        enableExponentialBackoff: true  # 지수 백오프 활성화
        exponentialBackoffMultiplier: 2  # 2배씩 증가 (500ms → 1s → 2s)
        retryExceptions: # 이 예외들만 재시도
          - org.springframework.data.redis.RedisConnectionFailureException
      kakaoRoute:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      naverRoute:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
          - java.net.ConnectException
          - java.io.IOException

eas:
  passport:
    secretKey: ${PASSPORT_SECRET}
    expiration: ${PASSPORT_EXPIRATION}
    algorithm: ${PASSPORT_ALGO}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus # Prometheus가 긁어갈 수 있게 노출
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true # P95, P99 등 히스토그램 데이터 수집
  otlp:
    tracing:
      endpoint: http://${MONITORING_URL}:4318/v1/traces # 로컬 Docker의 Tempo로 전송
  tracing:
    sampling:
      probability: 1.0 # 개발환경이므로 모든(100%) 트래픽 추적
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
