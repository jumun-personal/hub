server:
  port: 8088

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: hub-product-stock-company
  profiles:
    active: dev

  data:
    redis:
      cache:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD:}
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화
      black-friday:
        host: ${BF_REDIS_HOST}
        port: ${BF_REDIS_PORT}
        password: ${BF_REDIS_PASSWORD:}
        timeout: 3000ms
        ssl:
          enabled: false  # TLS 활성화

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      jakarta.persistence.lock.timeout: ${DB_LOCK_TIME_OUT}
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
  kafka:
    # 브로커 주소
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS} # localhost:9092
    # 토픽 설정 (커스텀)
    topics:
      hub: hub
      order: order
    producer:
      retries: 3
    consumer:
      # 컨슈머 그룹
      hub: ${KAFKA_CONSUMER_GROUP_HUB_DOMAIN}
      hub-route: ${KAFKA_CONSUMER_GROUP_HUB-ROUTE_DOMAIN}
      product: ${KAFKA_CONSUMER_GROUP_PRODUCT_DOMAIN}
      stock: ${KAFKA_CONSUMER_GROUP_STOCK_DOMAIN}
      company: ${KAFKA_CONSUMER_GROUP_COMPANY_DOMAIN}

# 로깅 설정 (Loki로 전송하기 위해 logback-spring.xml 사용 권장하지만, 간단 설정은 아래 참조)
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"
  level:
    # Hibernate binding 로그
    org.hibernate.orm.jdbc.bind: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
    # Hibernate SQL
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG


cache:
  config:
    hubService: ${HUB_SERVICE_CACHEABLE:REDIS}

kakao:
  mobility:
    api-key: ${KAKAO_MOBILITY_API_KEY}

naver:
  maps:
    base-url: ${NAVER_MAPS_BASE_URL:https://naveropenapi.apigw.ntruss.com}
    api-key-id: ${NAVER_MAPS_API_KEY_ID}
    api-key: ${NAVER_MAPS_API_KEY}

hub:
  compensation:
    deleted-by: ${HUB_COMPENSATION_DELETED_BY:0}
  route:
    provider-unavailable-ttl: ${HUB_ROUTE_PROVIDER_UNAVAILABLE_TTL:30s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_HOST}/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    ip-address: ${ECS_INSTANCE_IP_ADDRESS}


resilience4j:
  circuitbreaker:
    instances:
      kakaoRoute:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      routeResolve:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  ratelimiter:
    instances:
      kakaoRoute:
        limitForPeriod: 3
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms
      naverRoute:
        limitForPeriod: 3
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms

eas:
  passport:
    secretKey: ${PASSPORT_SECRET}
    expiration: ${PASSPORT_EXPIRATION}
    algorithm: ${PASSPORT_ALGO}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus # Prometheus가 긁어갈 수 있게 노출
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true # P95, P99 등 히스토그램 데이터 수집
  otlp:
    tracing:
      endpoint: http://${MONITORING_URL}:4318/v1/traces # 로컬 Docker의 Tempo로 전송
  tracing:
    sampling:
      probability: 1.0 # 개발환경이므로 모든(100%) 트래픽 추적
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
